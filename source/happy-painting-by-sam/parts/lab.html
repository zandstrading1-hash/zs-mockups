    <!-- ============ COLOUR LAB ============ -->
    <section class="lab" id="colour-lab" aria-labelledby="lab-title">
      <div class="wrap lab-grid">
        <div class="lab-copy">
          <p class="eyebrow reveal">Colour Lab</p>
          <h2 id="lab-title" class="reveal split">Can't pick a colour? Take one for a spin.</h2>
          <p class="reveal">Tap a swatch and watch the room get rolled. Your real pick happens with real paint chips, in your own light, at your free estimate.</p>

          <div class="swatches reveal" role="radiogroup" aria-label="Wall colour">
            <button class="sw" role="radio" aria-checked="false" style="--c:#1fa3ad" data-name="Happy Teal">&nbsp;</button>
            <button class="sw" role="radio" aria-checked="false" style="--c:#2f5f7f" data-name="Detroit River Blue">&nbsp;</button>
            <button class="sw" role="radio" aria-checked="false" style="--c:#8fa58a" data-name="Ojibway Sage">&nbsp;</button>
            <button class="sw" role="radio" aria-checked="false" style="--c:#e9b949" data-name="Tecumseh Corn">&nbsp;</button>
            <button class="sw" role="radio" aria-checked="false" style="--c:#c27a5a" data-name="Kingsville Clay">&nbsp;</button>
            <button class="sw" role="radio" aria-checked="false" style="--c:#6e4a5e" data-name="Walkerville Plum">&nbsp;</button>
            <button class="sw" role="radio" aria-checked="false" style="--c:#263a57" data-name="Belle River Navy">&nbsp;</button>
            <button class="sw" role="radio" aria-checked="true" style="--c:#e8dfcd" data-name="Lakeshore Linen">&nbsp;</button>
            <button class="sw" role="radio" aria-checked="false" style="--c:#34373c" data-name="Sam's Charcoal">&nbsp;</button>
          </div>

          <div class="lab-readout reveal" aria-live="polite">
            <span class="lab-chip" style="--c:#e8dfcd"></span>
            <div><b class="lab-name">Lakeshore Linen</b><small class="lab-hex">#E8DFCD</small></div>
            <span class="lab-status">Pick a colour</span>
          </div>

          <div class="trim-toggle reveal" role="group" aria-label="Trim colour">
            <span>Trim</span>
            <button class="tt is-on" data-trim="#fbfaf6" aria-pressed="true">Crisp white</button>
            <button class="tt" data-trim="#1d1f23" aria-pressed="false">Modern black</button>
          </div>

          <a class="btn btn--ink lab-cta reveal" href="#estimate">Love it? Put it on my walls &rarr;</a>
        </div>

        <div class="lab-stage reveal">
          <svg class="room" viewBox="0 0 1000 620" role="img" aria-label="Illustrated living room. The wall colour changes when you pick a swatch.">
            <defs>
              <clipPath id="rollClip">
                <rect class="rc" x="0" y="0" width="168" height="0" />
                <rect class="rc" x="167" y="0" width="168" height="0" />
                <rect class="rc" x="334" y="0" width="168" height="0" />
                <rect class="rc" x="501" y="0" width="168" height="0" />
                <rect class="rc" x="668" y="0" width="168" height="0" />
                <rect class="rc" x="835" y="0" width="168" height="0" />
              </clipPath>
              <linearGradient id="wallLight" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#fff" stop-opacity=".22" />
                <stop offset=".45" stop-color="#fff" stop-opacity="0" />
                <stop offset="1" stop-color="#000" stop-opacity=".16" />
              </linearGradient>
              <linearGradient id="wallTop" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#000" stop-opacity=".12" />
                <stop offset=".25" stop-color="#000" stop-opacity="0" />
              </linearGradient>
              <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#9fd6e6" />
                <stop offset="1" stop-color="#e9f6f4" />
              </linearGradient>
              <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#b98a5e" />
                <stop offset="1" stop-color="#d1a577" />
              </linearGradient>
              <radialGradient id="lampGlow" cx=".5" cy=".5" r=".5">
                <stop offset="0" stop-color="#ffd27a" stop-opacity=".55" />
                <stop offset="1" stop-color="#ffd27a" stop-opacity="0" />
              </radialGradient>
              <pattern id="nap" width="14" height="6" patternUnits="userSpaceOnUse"><rect width="14" height="6" fill="var(--roll)" /><path d="M0 3h14" stroke="#000" stroke-opacity=".12" stroke-width="2" /></pattern>
            </defs>

            <!-- wall -->
            <rect id="wallBase" x="0" y="0" width="1000" height="470" fill="#e8dfcd" />
            <rect id="wallNew" x="0" y="0" width="1000" height="470" fill="#e8dfcd" clip-path="url(#rollClip)" />
            <rect x="0" y="0" width="1000" height="470" fill="url(#wallLight)" />
            <rect x="0" y="0" width="1000" height="470" fill="url(#wallTop)" />

            <!-- crown -->
            <rect class="t" x="0" y="0" width="1000" height="18" />
            <rect x="0" y="18" width="1000" height="3" fill="#000" opacity=".08" />

            <!-- window -->
            <g class="win">
              <rect class="t" x="64" y="78" width="236" height="286" rx="3" />
              <rect x="80" y="94" width="204" height="250" fill="url(#sky)" />
              <path d="M80 300c30-30 50-20 70-40s50-10 70-34 40-6 64-20v138H80z" fill="#7fb59b" opacity=".55" />
              <path d="M80 320c40-24 80-6 120-28s60-2 84-14v66H80z" fill="#5e9a7f" opacity=".6" />
              <circle cx="236" cy="138" r="18" fill="#fff6d6" opacity=".9" />
              <rect class="t" x="178" y="94" width="8" height="250" />
              <rect class="t" x="80" y="214" width="204" height="8" />
              <rect class="t" x="52" y="360" width="260" height="14" rx="2" />
              <rect x="52" y="374" width="260" height="4" fill="#000" opacity=".1" />
            </g>

            <!-- art -->
            <g class="art-svg">
              <rect x="486" y="112" width="260" height="176" fill="#16181c" />
              <rect x="496" y="122" width="240" height="156" fill="#f4efe6" />
              <circle cx="590" cy="196" r="44" fill="#f28a2e" />
              <path d="M520 262c40-60 90-80 130-60s50 40 70 60z" fill="#1fa3ad" />
              <rect x="660" y="140" width="56" height="10" rx="5" fill="#16181c" />
            </g>

            <!-- outlet -->
            <rect class="t" x="358" y="412" width="18" height="28" rx="2" />
            <circle cx="367" cy="421" r="2" fill="#999" /><circle cx="367" cy="431" r="2" fill="#999" />

            <!-- baseboard + floor -->
            <rect class="t" x="0" y="452" width="1000" height="22" />
            <rect x="0" y="452" width="1000" height="3" fill="#000" opacity=".1" />
            <rect x="0" y="474" width="1000" height="146" fill="url(#floor)" />
            <g stroke="#8a6440" stroke-opacity=".35" stroke-width="2">
              <path d="M0 506h1000M0 542h1000M0 582h1000" />
              <path d="M140 474v32M420 474v32M760 474v32M60 506v36M300 506v36M610 506v36M880 506v36M200 542v40M520 542v40M840 542v40M90 582v38M400 582v38M700 582v38" />
            </g>

            <!-- roller (animated) -->
            <g id="labRoller" opacity="0">
              <rect x="-80" y="-18" width="160" height="36" rx="18" fill="url(#nap)" />
              <rect x="-80" y="-18" width="160" height="36" rx="18" fill="none" stroke="#000" stroke-opacity=".18" stroke-width="2" />
              <rect x="-80" y="-18" width="160" height="12" rx="6" fill="#fff" opacity=".18" />
              <path d="M80 0h14v44c0 10-6 16-16 22L0 104" fill="none" stroke="#bfc7cc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
              <rect x="-12" y="100" width="24" height="16" rx="3" fill="#9aa4aa" />
              <rect x="-14" y="114" width="28" height="120" rx="14" fill="#f28a2e" />
              <rect x="-6" y="124" width="5" height="96" rx="2.5" fill="#fff" opacity=".35" />
            </g>

            <!-- rug -->
            <path d="M260 560h560l70 56H190z" fill="#efe6d5" />
            <path d="M300 572h480M285 588h510M270 604h540" stroke="#1fa3ad" stroke-opacity=".5" stroke-width="5" />

            <!-- plant -->
            <g>
              <path d="M368 360c-30-40-60-36-74-70 34 6 56 28 74 70z" fill="#4f8f5f" />
              <path d="M372 360c4-50-14-80 6-122 22 40 10 76-6 122z" fill="#5fa36f" />
              <path d="M376 362c26-36 56-46 84-40-20 30-48 40-84 40z" fill="#3f7f50" />
              <path d="M340 360h70l-10 92h-50z" fill="#c27a5a" />
              <rect x="334" y="352" width="82" height="14" rx="3" fill="#a8613f" />
            </g>

            <!-- sofa -->
            <g>
              <rect x="470" y="318" width="420" height="104" rx="22" fill="#2b2f36" />
              <rect x="452" y="372" width="456" height="78" rx="18" fill="#353a42" />
              <rect x="440" y="350" width="52" height="104" rx="20" fill="#2b2f36" />
              <rect x="868" y="350" width="52" height="104" rx="20" fill="#2b2f36" />
              <rect x="496" y="366" width="180" height="40" rx="12" fill="#3d434c" />
              <rect x="684" y="366" width="180" height="40" rx="12" fill="#3d434c" />
              <rect x="508" y="324" width="78" height="56" rx="16" fill="#f28a2e" transform="rotate(-8 547 352)" />
              <rect x="776" y="324" width="78" height="56" rx="16" fill="#1fa3ad" transform="rotate(7 815 352)" />
              <rect x="470" y="450" width="12" height="20" rx="3" fill="#1d1f23" />
              <rect x="878" y="450" width="12" height="20" rx="3" fill="#1d1f23" />
            </g>

            <!-- lamp -->
            <g>
              <circle cx="950" cy="196" r="120" fill="url(#lampGlow)" />
              <path d="M918 156h64l16 70h-96z" fill="#f4efe6" />
              <rect x="947" y="226" width="6" height="236" fill="#1d1f23" />
              <ellipse cx="950" cy="468" rx="30" ry="7" fill="#1d1f23" />
            </g>
          </svg>
          <p class="lab-note">Colours on screen are approximate.</p>
        </div>
      </div>
    </section>
